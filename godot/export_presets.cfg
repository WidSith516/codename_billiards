[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Exclude dev-only material from the shipped build: the evidence screenshots, the test
; suite, the authoring notes and the M2 report. NOTE the kernel's .csproj and .sln are
; deliberately NOT excluded: a missing .sln makes Godot return rc=0 while silently
; omitting the C# assembly, which only fails at runtime.
exclude_filter="tests/*,evidence/*,*.md,levels/h5_rack.json,levels/L0_factory.json,addons/godot_mcp/*"
export_path="dist/REWIND.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="REWIND"
application/product_name="REWIND"
application/file_description="REWIND - one-shot time-rewind billiards"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
ssh_remote_deploy/enabled=false

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Same exclusions as the Windows preset, for the same reason: the test suite, evidence
; screenshots and authoring notes must not ship. The .csproj/.sln are NOT excluded -- a missing
; .sln makes Godot return rc=0 while silently omitting the C# assembly, which then only fails at
; runtime on the device, where it is far more expensive to diagnose.
exclude_filter="tests/*,evidence/*,*.md,levels/h5_rack.json,levels/L0_factory.json,addons/godot_mcp/*"
export_path="dist/REWIND.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; No custom gradle build: the project uses no plugins and no native code, so Godot's prebuilt
; template is enough. Turning it on would add a full Gradle/AGP download and toolchain to the
; build for no gain.
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; arm64-v8a only. Every Android phone sold for years is arm64, and each enabled architecture
; roughly doubles the native payload. x86_64 is deliberately OFF here but the emulator needs it
; -- there is a separate note about that in tools/build_android.ps1, which flips this on for
; emulator testing builds only.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1-mobile"
package/unique_name="com.rewind.billiards"
package/name="REWIND"
; package/signed=false does NOT mean "unsigned on purpose" -- it means "signing is done by the
; packaging script". Godot's three debug-keystore fields (keystore / user / password) must be
; either ALL filled or ALL empty, and the password field only accepts a key name from the editor
; settings rather than a literal, so a half-filled preset fails the export outright with
; "debug keystore / debug user / debug password must all be filled or all be empty".
; Signing is therefore done explicitly with zipalign + apksigner, which is verifiable
; (apksigner verify --print-certs prints the result) instead of depending on an editor setting
; that cannot be set from here.
package/signed=false
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
; Android REQUIRES an ETC2/ASTC texture compression format -- the engine's own note says so, and
; gl_compatibility on mobile has no S3TC fallback. This pairs with
; textures/vram_compression/import_etc2_astc=true in project.godot. The desktop counterpart is
; s3tc_bptc. This is the engine selecting a different format per platform, not config drift.
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
; Immersive mode hides the status and navigation bars, and the touch controls are laid out with
; that extra height in mind. Without it the gesture bar sits on top of the bottom edge of the
; table and eats taps.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
; NO PERMISSIONS AT ALL, deliberately. This is an offline single-player puzzle: it has no
; networking, no storage beyond its own save file, and no ad or analytics code. A billiards game
; asking for INTERNET is the kind of thing that reads as suspicious on an install screen, so the
; list is left empty rather than copied from a template.
permissions/custom_permissions=PackedStringArray()
permissions/access_network_state=false
